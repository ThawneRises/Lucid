name: Lucid Gallery Release Build

on:
  push:
    branches:
      - Test
      - Master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Deploy Lucid
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Android SDK & Build Files
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/.android/sdk
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/modules-2
            build/.gradle
          key: ${{ runner.os }}-android-build-v1-${{ hashFiles('**/build.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-build-v1-

      - name: Check Cache Status
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache HIT! Build will be faster"
          else
            echo "❌ Cache MISS! Building from scratch"
          fi

          echo "Gradle cache size:"
          du -sh ~/.gradle/caches/ 2>/dev/null || echo "No gradle cache"
          echo "Android SDK cache size:"
          du -sh ~/.android/sdk/ 2>/dev/null || echo "No Android SDK cache"

      - name: Delete Old Caches
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "Deleting old caches..."

          rm -rf ~/.gradle/caches/modules-2/ 2>/dev/null || true
          rm -rf ~/.gradle/caches/*/ 2>/dev/null || true

          rm -rf build/.gradle/ 2>/dev/null || true

          rm -rf ~/.android/sdk/.temp/ 2>/dev/null || true
          rm -rf ~/.android/sdk/temp/ 2>/dev/null || true

          echo "Old caches deleted"
          echo "Available space:"
          df -h /home/runner/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore from Base64
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > gallery-key.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << EOF
          storeFile=./gallery-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Signed Release APK
        id: build
        run: |
          ./gradlew --no-daemon --parallel --stacktrace :app:assembleRelease 2>&1 | tee Lucid-Gallery-Build.log

          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" -type f | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "No APK found in app/build/outputs/apk/release/"
            echo "Listing all APK files:"
            find app/build/outputs/ -name "*.apk" -type f
            exit 1
          fi

          echo "Found APK at: $APK_PATH"
          mv "$APK_PATH" Lucid-Gallery.apk
          ls -la Lucid-Gallery.apk

      - name: Upload APK as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lucid-Gallery-Release-apk-${{ github.run_number }}
          path: Lucid-Gallery.apk
          retention-days: 14

      - name: Create ZIP with DateTime
        if: success()
        run: |
          DATETIME=$(date +'%Y%m%d_%H%M%S')
          zip -9 "Lucid-Gallery-${DATETIME}.zip" Lucid-Gallery.apk
          echo "Created ZIP: Lucid-Gallery-${DATETIME}.zip"
          ls -la Lucid-Gallery-*.zip
          echo "ZIP_FILE=Lucid-Gallery-${DATETIME}.zip" >> $GITHUB_ENV

      - name: Send Failed Build Log to Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TEST_BUILDS }}
        run: |
          curl --silent --show-error \
            -F chat_id="$CHAT_ID" \
            -F parse_mode=HTML \
            -F "caption=<b>❌ Lucid Gallery release build failed</b>" \
            -F document=@Lucid-Gallery-Build.log \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

      - name: Parse Commit & Send ZIP to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TEST_BUILDS }}
        run: |
          FULL_COMMIT="$(git log -1 --pretty=%B)"
          COMMIT_TIME="$(git log -1 --pretty=%ci)"
          COMMIT_AUTHOR="$(git log -1 --pretty=%an)"
          COMMIT_HASH="$(git log -1 --pretty=%h)"

          SAFE_COMMIT=$(echo "$FULL_COMMIT" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')

          CAPTION="<b>✅ Lucid Gallery Built Successfully</b>

          <b>Commit:</b>
          $SAFE_COMMIT

          <b>Hash:</b> $COMMIT_HASH
          <b>Author:</b> $COMMIT_AUTHOR
          <b>Time:</b> $COMMIT_TIME"

          echo "$CAPTION" > caption.txt

          ZIP_FILE=$(ls Lucid-Gallery-*.zip | head -n 1)
          ZIP_SIZE=$(stat -c%s "$ZIP_FILE")
          ZIP_SIZE_MB=$((ZIP_SIZE / 1024 / 1024))

          echo "ZIP file: $ZIP_FILE"
          echo "ZIP size: ${ZIP_SIZE_MB}MB (${ZIP_SIZE} bytes)"

          if [ $ZIP_SIZE -gt 49000000 ]; then
            echo "ZIP too large for Telegram (50MB limit)"
            echo "Sending notification without file..."

            curl --silent --show-error \
              -F chat_id="$CHAT_ID" \
              -F parse_mode=HTML \
              -F "text=<b>✅ Lucid Gallery Built Successfully</b>%0A%0A<b>Commit:</b>%0A$SAFE_COMMIT%0A%0A<b>Hash:</b> $COMMIT_HASH%0A<b>Author:</b> $COMMIT_AUTHOR%0A<b>Time:</b> $COMMIT_TIME%0A%0A⚠️ APK too large for Telegram" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage"
          else
            echo "Sending ZIP to Telegram..."

            curl --silent --show-error \
              -F chat_id="$CHAT_ID" \
              -F parse_mode=HTML \
              -F "caption=<caption.txt" \
              -F "document=@$ZIP_FILE" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          fi